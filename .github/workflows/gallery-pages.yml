name: Publish gallery

on:
  push:
    branches: [main]
    paths:
      - 'gallery/style24-comparison-20260929/**'
      - 'tools/check_showcase.py'
      - 'tools/showcase_assets.py'
      - 'tools/brand_assets.py'
      - 'tools/brand_cards/**'
      - 'tests/test_showcase.py'
      - 'tests/test_brand_assets.py'
      - 'tests/test_home_copy.py'
      - 'tests/test_showcase_navigation.py'
      - 'tests/check_home_ui.cjs'
      - 'requirements-dev.txt'
      - 'docs/demo/primary-cases/white-hooded-puffer-vest-korean-cold/**'
      - 'docs/demo/preview-sources/beige-blazer-denim-outfit/**'
      - '.github/workflows/gallery-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install showcase checker dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Verify committed showcase assets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest tests.test_showcase tests.test_brand_assets tests.test_home_copy tests.test_showcase_navigation
          python tools/check_showcase.py --gallery gallery/style24-comparison-20260929 --repo-root .
      - name: Verify homepage in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/threadtruth-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/threadtruth-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/threadtruth-browser/node_modules" node tests/check_home_ui.cjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gallery/style24-comparison-20260929
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v5
