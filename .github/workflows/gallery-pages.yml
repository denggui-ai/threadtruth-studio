name: Publish gallery

on:
  push:
    branches: [main]
    paths:
      - 'gallery/style24-comparison-20260929/**'
      - '.github/workflows/gallery-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gallery/style24-comparison-20260929
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v5
