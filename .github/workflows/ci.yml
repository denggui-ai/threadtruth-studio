name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install development image dependency
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Require development-only CJK test font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Install development-only image compositor dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/threadtruth-image" --no-package-lock --ignore-scripts sharp@0.35.4
          NODE_PATH="$RUNNER_TEMP/threadtruth-image/node_modules" node -e "require('sharp'); console.log('sharp available')"
      - name: Repository contracts
        env:
          NODE_PATH: ${{ runner.temp }}/threadtruth-image/node_modules
        run: python3 -m unittest discover -s tests -v
      - name: Homepage browser regression
        run: |
          npm install --prefix "$RUNNER_TEMP/threadtruth-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/threadtruth-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/threadtruth-browser/node_modules" node tests/check_home_ui.cjs
      - name: Style-pack lint
        run: python3 tools/pack-lint.py --strict skills/threadtruth-studio/references/styles/*.pack.yaml
      - name: Trigger regression
        run: python3 tools/trigger-eval.py
      - name: Parse JSON and compile Python
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
          PY
          python3 -m compileall -q skills tests tools
      - name: Public text and history scan
        run: python3 tools/public-scan.py --history
      - name: Allowlist release staging
        run: |
          python3 tools/build-release.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('.codex-plugin/plugin.json').read_text())['version']
          for suffix in ('.zip', '.zip.sha256'):
              assert Path(f'dist/threadtruth-studio-{version}{suffix}').is_file()
          PY
