entries.forEach((e,i)=>{
  const card=document.createElement('article');card.className='card';card.dataset.index=i;
  const pic=document.createElement('img');pic.src=e.path;pic.alt=e.title+'，'+e.view+'视图';pic.loading='lazy';card.append(pic);
  const c=document.createElement('div');c.className='content';
  const title=document.createElement('h2'),label=document.createElement('label'),check=document.createElement('input');
  check.type='checkbox';check.value=i;label.append(check,document.createTextNode(e.title));title.append(label);c.append(title);
  const id=document.createElement('small');id.textContent=e.group_id+' / '+e.view;c.append(id);
  const limit=document.createElement('small');limit.className='limit'+(e.selection_policy?' restricted':'');limit.textContent=e.avoid_when;c.append(limit);
  const slot=document.createElement('input');slot.type='text';slot.className='slot';slot.placeholder='应用图号（可留空）';slot.setAttribute('aria-label',e.title+'应用图号');c.append(slot);
  const detail=document.createElement('details'),summary=document.createElement('summary'),note=document.createElement('p');
  summary.textContent='动作与复核说明';note.textContent=e.body_action+' Hands: '+e.hands+' Support: '+e.support+' '+e.review_note;
  detail.append(summary,note);c.append(detail);card.append(c);cards.append(card);
  check.addEventListener('change',update);slot.addEventListener('input',update);
});
function update(){
  const selected=[...cards.children].filter(c=>c.querySelector('input[type=checkbox]').checked);
  const mode=document.querySelector('#mode').value;
  document.querySelector('#result').value=selected.length?'我指定以下动作，其余请按商品与风格安排：\n'+selected.map(c=>{
    const e=entries[c.dataset.index],slot=c.querySelector('.slot').value.trim();
    return (slot?'第'+slot+'张：':'')+e.title+' ['+e.group_id+' / '+e.view+']'+(e.selection_policy?'（受限：右前臂仍遮腹；不用作腰腹无遮挡展示，保留此限制）':'');
  }).join('；\n')+'。\n'+(mode==='image'?'独立图附对应线稿，保持身体、手与支撑关系；若商品或附件容量冲突，请说明具体取舍。九格预览仍用动作文字。':'按动作意图执行，可按商品微调；不默认添加线稿。'):'';
  document.querySelector('#status').textContent=selected.length?'已选 '+selected.length+' 个视图':'还未选择';
}
function filter(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#family').value;[...cards.children].forEach(c=>{const e=entries[c.dataset.index];c.hidden=!!((f&&e.family!==f)||(q&&!JSON.stringify(e).toLowerCase().includes(q)))})}
document.querySelector('#family').addEventListener('change',filter);document.querySelector('#search').addEventListener('input',filter);document.querySelector('#mode').addEventListener('change',update);document.querySelector('#clear').addEventListener('click',()=>{cards.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);update()});document.querySelector('#copy').addEventListener('click',async()=>{const t=document.querySelector('#result');if(!t.value)return;try{await navigator.clipboard.writeText(t.value);document.querySelector('#status').textContent='已复制，回到聊天粘贴即可'}catch{t.focus();t.select();document.querySelector('#status').textContent='文字已选中，请复制后回到聊天粘贴'}});
